<!DOCTYPE html>
<html>
<head>
    <title>My Calculator</title>
</head>

<body bgcolor="lightgrey">

<center>

    <table border="8" cellpadding="28"
           cellspacing="10" bgcolor="lightyellow"
           width="300">

        <tr>
            <td colspan="4" align="right"
                bgcolor="white">
                0
            </td>
        </tr>

        <tr align="center" bgcolor="lightblue">
            <td>7</td>
            <td>8</td>
            <td>9</td>
            <td>+</td>
        </tr>

        <tr align="center" bgcolor="lightblue">
            <td>4</td>
            <td>5</td>
            <td>6</td>
            <td>-</td>
        </tr>

        <tr align="center" bgcolor="lightblue">
            <td>1</td>
            <td>2</td>
            <td>3</td>
            <td>*</td>
        </tr>

        <tr align="center" bgcolor="lightblue">
            <td>0</td>
            <td>.</td>
            <td>=</td>
            <td>/</td>
        </tr>

    </table>
</center>
</body>
</html>
